<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Diff Test</title>
<style>
/* Reset */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #e6edf3; font-family: sans-serif; padding: 2rem; }

/* Dark theme */
.d2h-dark-color-scheme { background-color: #0d1117; color: #e6edf3; }

/* Simulate our dashboard's td reset */
.d2h-dark-color-scheme td {
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  font-size: inherit;
  border-bottom: none;
}

/* Font fix */
.d2h-dark-color-scheme .d2h-code-line,
.d2h-dark-color-scheme .d2h-code-side-line { font-size: 0.8rem; line-height: 1.5; }

/* Line number */
.d2h-dark-color-scheme .d2h-code-side-linenumber {
  font-size: 0.8rem; line-height: 1.5; vertical-align: top;
  position: relative !important; width: 3em; min-width: 3em;
  padding-right: 0 !important; border: none !important;
}

/* Content: block fill */
.d2h-dark-color-scheme .d2h-code-side-line {
  display: block !important;
  padding-left: 0.375em !important;
  padding-right: 0.5em !important;
  width: auto !important;
}
</style>
<link rel="stylesheet" href="/opt/workspace/omni-dashboard/node_modules/diff2html/bundles/css/diff2html.min.css">
</head><body>
<h2>Diff Test - Short Lines</h2>
<div id="diff-container" class="d2h-dark-color-scheme"></div>

<script>
import('diff2html').then(({ html: diffHtml }) => {
  const diff = `--- a/file.txt
+++ b/file.txt
@@ -1,5 +1,5 @@
-a
+b
 c
 d
 e
 f`;

  document.getElementById('diff-container').innerHTML = diffHtml(diff, {
    drawFileList: false,
    matching: 'lines',
    outputFormat: 'side-by-side'
  });

  // Log the structure
  const tbody = document.querySelector('.d2h-diff-tbody');
  if (tbody) {
    const firstRow = tbody.querySelector('tr');
    if (firstRow) {
      console.log('First row HTML:', firstRow.outerHTML);
      console.log('First row cells:', firstRow.cells.length);
      for (let i = 0; i < firstRow.cells.length; i++) {
        const cell = firstRow.cells[i];
        const style = getComputedStyle(cell);
        console.log('Cell', i, ':', cell.className);
        console.log('  display:', style.display);
        console.log('  position:', style.position);
        console.log('  width:', style.width);
        console.log('  padding:', style.padding);
        console.log('  background-color:', style.backgroundColor);
      }
    }
  }
});
</script>
</body></html>
